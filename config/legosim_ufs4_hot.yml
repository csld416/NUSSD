# UFS 4.0-equivalent LegoSim harness for the SimpleSSD active simlet,
# cache-enabled hot read path.
#
# See config/legosim_ufs4.yml for the UFS4 link assumptions. This file differs
# only in the SimpleSSD config: it uses sample.cfg instead of sample_nocache.cfg.

phase1:
  - cmd: "/home/csld/SIM/PyTorchSim/TOGSim/tests/build/dram_legosim_driver"
    args: ["4096"]
    log: "togsim_dram_legosim.log"
    is_to_stdout: false
    clock_rate: 1

  - cmd: "/home/csld/SIM/SimpleSSD-Standalone/build/simplessd-legosim"
    args:
      - "/home/csld/SIM/SimpleSSD-Standalone/config/sample.cfg"
      - "/home/csld/SIM/SimpleSSD-Standalone/simplessd/config/sample.cfg"
      - "/home/csld/SIM/SimpleSSD-Standalone/build"
      - "1"
      - "0"
      - "0"
      - "0"
      - "4096"
      - "1"
    log: "simplessd.log"
    is_to_stdout: false
    clock_rate: 1

phase2:
  - cmd: "/home/csld/SIM/LEGOSIM_MICRO/popnet_chiplet/build/popnet"
    args:
      - "-A"
      - "2"
      - "-c"
      - "1"
      - "-V"
      - "3"
      - "-B"
      - "12"
      - "-O"
      - "12"
      - "-F"
      - "1"
      - "-L"
      - "1000"
      - "-T"
      - "20000000000"
      - "-r"
      - "1"
      - "-I"
      - "../bench.txt"
      - "-G"
      - "/home/csld/SIM/SimpleSSD-Standalone/topology/line_2_ufs4.gv"
      - "-R"
      - "4"
      - "-D"
      - "../delayInfo.txt"
      - "-P"
    log: "popnet_0.log"
    is_to_stdout: false
    clock_rate: 0.000725
