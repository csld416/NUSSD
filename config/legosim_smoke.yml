# Minimal LegoSim harness for the SimpleSSD active simlet.
#
# Run from anywhere with (--cwd controls where the run's output/scratch
# subdirectories get created; this file's own location doesn't matter):
#   SIMULATOR_ROOT=/Users/csld/ECLAB/SIM/LEGOSIM_MICRO \
#     /Users/csld/ECLAB/SIM/LEGOSIM_MICRO/interchiplet/bin/interchiplet \
#     /Users/csld/ECLAB/SIM/config/legosim_smoke.yml \
#     --cwd /Users/csld/ECLAB/SIM/SimpleSSD-Standalone -t 3 -w 2 -f 2

phase1:
  - cmd: "/Users/csld/ECLAB/SIM/dummy_npu/build/simplessd-dummy-npu"
    args: ["0", "0", "1", "0", "4096", "1", "1"]
    log: "dummy_npu.log"
    is_to_stdout: false
    clock_rate: 1

  - cmd: "/Users/csld/ECLAB/SIM/SimpleSSD-Standalone/build/simplessd-legosim"
    args:
      - "/Users/csld/ECLAB/SIM/SimpleSSD-Standalone/config/sample.cfg"
      - "/Users/csld/ECLAB/SIM/SimpleSSD-Standalone/simplessd/config/sample.cfg"
      - "/Users/csld/ECLAB/SIM/SimpleSSD-Standalone/build"
      - "1"
      - "0"
      - "0"
      - "0"
      - "4096"
      - "1"
    log: "simplessd.log"
    is_to_stdout: false
    clock_rate: 1

phase2:
  - cmd: "/Users/csld/ECLAB/SIM/LEGOSIM_MICRO/popnet_chiplet/build/popnet"
    args:
      - "-A"
      - "2"
      - "-c"
      - "1"
      - "-V"
      - "3"
      - "-B"
      - "12"
      - "-O"
      - "12"
      - "-F"
      - "2"
      - "-L"
      - "1000"
      - "-T"
      - "1000000000"
      - "-r"
      - "1"
      - "-I"
      - "../bench.txt"
      - "-G"
      - "/Users/csld/ECLAB/SIM/SimpleSSD-Standalone/topology/line_2.gv"
      - "-D"
      - "../delayInfo.txt"
      - "-P"
    log: "popnet_0.log"
    is_to_stdout: false
    clock_rate: 1
