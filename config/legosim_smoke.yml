# Minimal LegoSim harness for the SimpleSSD active simlet.
#
# Run from anywhere with (--cwd controls where the run's output/scratch
# subdirectories get created; this file's own location doesn't matter):
#   SIMULATOR_ROOT=/home/csld/SIM/LEGOSIM_MICRO \
#     /home/csld/SIM/LEGOSIM_MICRO/interchiplet/bin/interchiplet \
#     /home/csld/SIM/config/legosim_smoke.yml \
#     --cwd /home/csld/SIM/SimpleSSD-Standalone -t 3 -w 2 -f 2

phase1:
  - cmd: "/home/csld/SIM/PyTorchSim/TOGSim/tests/build/dram_legosim_driver"
    args: ["4096"]
    log: "togsim_dram_legosim.log"
    is_to_stdout: false
    clock_rate: 1

  - cmd: "/home/csld/SIM/SimpleSSD-Standalone/build/simplessd-legosim"
    args:
      - "/home/csld/SIM/SimpleSSD-Standalone/config/sample.cfg"
      - "/home/csld/SIM/SimpleSSD-Standalone/simplessd/config/sample.cfg"
      - "/home/csld/SIM/SimpleSSD-Standalone/build"
      - "1"
      - "0"
      - "0"
      - "0"
      - "4096"
      - "1"
    log: "simplessd.log"
    is_to_stdout: false
    clock_rate: 1

phase2:
  - cmd: "/home/csld/SIM/LEGOSIM_MICRO/popnet_chiplet/build/popnet"
    args:
      - "-A"
      - "2"
      - "-c"
      - "1"
      - "-V"
      - "3"
      - "-B"
      - "12"
      - "-O"
      - "12"
      - "-F"
      - "2"
      - "-L"
      - "1000"
      - "-T"
      - "1000000000"
      - "-r"
      - "1"
      - "-I"
      - "../bench.txt"
      - "-G"
      - "/home/csld/SIM/SimpleSSD-Standalone/topology/line_2.gv"
      - "-D"
      - "../delayInfo.txt"
      - "-P"
    log: "popnet_0.log"
    is_to_stdout: false
    # PopNet cycles are modeled as ns; SimpleSSD/interchiplet ticks are ps.
    # This converts bench timestamps ps->ns and delayInfo ns->ps.
    clock_rate: 0.001
